services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clevergadgets
      POSTGRES_PASSWORD: clevergadgets
      POSTGRES_DB: clevergadgets
    ports:
      # Host-Port 5434, damit es nicht mit einem lokalen Postgres (5432) oder der Finifeed-DB (5433) kollidiert.
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clevergadgets -d clevergadgets"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
