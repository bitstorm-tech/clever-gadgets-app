services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clevergadgets
      POSTGRES_PASSWORD: clevergadgets
      POSTGRES_DB: clevergadgets
    ports:
      # Host port 5434, so it does not collide with a local Postgres (5432) or the Finifeed DB (5433).
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clevergadgets -d clevergadgets"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
